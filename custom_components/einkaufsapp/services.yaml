plan_generieren:
  fields:
    woche:
      selector:
        date:
tag_neu_wuerfeln:
  fields:
    tag:
      required: true
      selector:
        select:
          options: [montag, dienstag, mittwoch, donnerstag, freitag, samstag, sonntag]
    woche:
      selector:
        date:
rest_einbuchen:
  fields:
    name:
      required: true
      selector:
        text:
    portionen:
      required: true
      default: 1
      selector:
        number:
          min: 0.5
          max: 99
          step: 0.5
          mode: box
    ort:
      required: true
      default: kuehlschrank
      selector:
        select:
          options: [kuehlschrank, gefrierschrank]
    haltbar_bis:
      selector:
        date:
    gekocht_am:
      selector:
        date:
gericht_bewerten:
  fields:
    gericht:
      required: true
      selector:
        text:
    sterne:
      required: true
      selector:
        number:
          min: 0
          max: 5
          mode: slider
artikel_hinzufuegen:
  fields:
    name:
      required: true
      selector:
        text:
    menge:
      selector:
        number:
          min: 0.01
          max: 10000
          step: 0.01
          mode: box
    einheit:
      selector:
        select:
          options: ["Stück", "Packung", "g", "kg", "ml", "l"]
